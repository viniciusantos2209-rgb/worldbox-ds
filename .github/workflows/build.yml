name: Build WorldBox DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar libnds
        run: dkp-pacman -Sy --noconfirm nds-dev
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-nds
          path: worldbox.nds
